<!DOCTYPE html>
<html>
<head>
    <title>Book Cricket Tickets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Cricket Ticket Booking</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="players.html">Players</a>
    <a href="rules.html">Rules</a>
    <a href="gallery.html">Gallery</a>
    <a href="legends.html">Legends</a>
</nav>

<main>
    <h2>Book Your Tickets</h2>

    <form>
        <div class="form-row">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Mobile Number:</label>
                <input type="tel" pattern="[0-9]{10}" placeholder="10 digit number" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Select Match:</label>
                <select required>
                    <option value="">Select Match</option>
                    <option>India vs Australia</option>
                    <option>India vs England</option>
                    <option>India vs South Africa</option>
                    <option>India vs New Zealand</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Match Date:</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Seat Type:</label>
                <select>
                    <option>General</option>
                    <option>Premium</option>
                    <option>VIP</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Number of Tickets:</label>
                <input type="number" min="1" max="10" required>
            </div>

            <div class="form-group">
                <label>Payment Method:</label>
                <select>
                    <option>UPI</option>
                    <option>Debit Card</option>
                    <option>Credit Card</option>
                    <option>Net Banking</option>
                </select>
            </div>
        </div>

        <div style="text-align:center;">
            <button type="submit">Book Ticket</button>
            <button type="reset">Clear</button>
        </div>
    </form>

    <a class="back" href="index.html">Back to Homepage</a>
</main>

<footer>Joesal's Cricket World</footer>

</body>
</html>
